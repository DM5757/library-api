spring.datasource.url=jdbc:h2:mem:library-test-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

app.settings.application-title=Library API Test
app.settings.default-page-size=10
app.settings.support-email=test@example.com
app.settings.external-service-url=http://localhost/test-service
app.settings.feature-enabled=true

# Actuator for tests
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Library API
info.app.description=Spring Boot final project
info.app.version=1.0.0
