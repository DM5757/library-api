# DataSource (expecting environment variables)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/library_db}
spring.datasource.username=${DATABASE_USERNAME:library_user}
spring.datasource.password=${DATABASE_PASSWORD:library_password}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# H2 Console disabled
spring.h2.console.enabled=false

# Logging
logging.level.root=WARN
logging.level.com.davit.libraryapi=WARN

# App Settings for Prod
app.settings.application-title=Library API (Production)
app.settings.support-email=support@davit.com
