# Common Settings
spring.application.name=library-api
spring.messages.encoding=UTF-8

# App Settings Defaults
app.settings.application-title=Library API
app.settings.default-page-size=20
app.settings.support-email=support@example.com
app.settings.external-service-url=https://api.example.com
app.settings.feature-enabled=true

# Logging
logging.file.name=logs/app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# Server Errors
server.error.include-message=always
server.error.include-binding-errors=always

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Library API
info.app.description=Spring Boot final project
info.app.version=1.0.0